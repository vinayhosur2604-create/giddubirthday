
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Letter From The Heart</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&display=swap');

:root {
    --night: #090b20;
    --purple: #30204f;
    --paper: #f0dfba;
    --ink: #543b2b;
    --gold: #d6b77e;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background:
        radial-gradient(ellipse at 50% 45%,
            #30204f 0%,
            #17132f 50%,
            #090b20 100%);
    font-family: 'Cormorant Garamond', serif;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

/* Background ambient glow */

.ambient {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: rgba(150, 100, 220, .13);
    filter: blur(110px);
    pointer-events: none;
}

/* Scene */

.scene {
    min-height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 15px;
    position: relative;
    z-index: 1;
}

.intro {
    text-align: center;
    margin-bottom: 65px;
    transition: opacity .8s, transform .8s;
}

.intro h1 {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(38px, 6vw, 65px);
    font-weight: 400;
    color: #e7d1aa;
    text-shadow: 0 0 25px rgba(218, 185, 130, .3);
}

.intro p {
    font-size: 15px;
    color: #b9a8ce;
    letter-spacing: 4px;
    margin-top: 10px;
    text-transform: uppercase;
}

.intro.hidden {
    opacity: 0;
    transform: translateY(-25px);
    pointer-events: none;
}

/* Envelope */

.envelope-area {
    width: min(460px, 88vw);
    height: 300px;
    position: relative;
    perspective: 1200px;
}

.envelope {
    position: absolute;
    inset: 0;
    background: linear-gradient(145deg, #a17b54, #745137);
    border-radius: 5px;
    box-shadow:
        0 30px 70px rgba(0,0,0,.55),
        inset 0 0 30px rgba(35,20,10,.4);
    z-index: 3;
}

/* Inner envelope */

.envelope-back {
    position: absolute;
    inset: 0;
    background: linear-gradient(145deg, #b28b60, #795537);
    border-radius: 5px;
}

/* Letter inside envelope */

.letter {
    position: absolute;
    width: 90%;
    left: 5%;
    height: 255px;
    bottom: 10px;
    z-index: 2;

    background:
        radial-gradient(ellipse at center,
            #f5e8c9,
            #e5d0a5);

    color: var(--ink);
    border: 1px solid #b89a6c;

    padding: 25px;
    text-align: center;

    transform: translateY(0);
    transition: transform 1.5s cubic-bezier(.2,.7,.2,1);
}

.letter h2 {
    font-family: 'Great Vibes', cursive;
    font-size: 35px;
    font-weight: 400;
}

.letter p {
    font-style: italic;
    margin-top: 15px;
}

/* Envelope front folds */

.envelope-front {
    position: absolute;
    inset: 0;
    z-index: 4;
    overflow: hidden;
    pointer-events: none;
}

.fold-left {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 0;
    border-left: min(230px, 44vw) solid #a67e54;
    border-top: 150px solid transparent;
    border-bottom: 150px solid transparent;
    filter: brightness(.92);
}

.fold-right {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 0;
    height: 0;
    border-right: min(230px, 44vw) solid #9b754e;
    border-top: 150px solid transparent;
    border-bottom: 150px solid transparent;
}

.fold-bottom {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 0;
    border-left: min(230px, 44vw) solid transparent;
    border-right: min(230px, 44vw) solid transparent;
    border-bottom: 170px solid #b18b5f;
}

/* Envelope flap */

.flap {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 150px;
    background: #c09b6c;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform 1s ease;
    z-index: 6;
    filter: drop-shadow(0 5px 4px rgba(0,0,0,.2));
}

.envelope-area.opened .flap {
    transform: rotateX(180deg);
    z-index: 1;
}

/* Wax seal */

.wax-seal {
    position: absolute;
    top: 105px;
    left: 50%;
    transform: translateX(-50%);
    width: 76px;
    height: 76px;
    border-radius: 50%;
    z-index: 8;
    cursor: pointer;

    display: flex;
    justify-content: center;
    align-items: center;

    color: #f5d9a1;
    font-size: 34px;

    background:
        radial-gradient(circle at 35% 30%,
            #df7772,
            #a32f3b 55%,
            #681e2a);

    border: 3px solid #9c3037;

    box-shadow:
        0 5px 15px rgba(0,0,0,.4),
        inset 0 2px 6px rgba(255,255,255,.3);

    transition: opacity .5s, transform .6s;
    animation: sealGlow 3s infinite alternate;
}

@keyframes sealGlow {
    from { box-shadow: 0 0 10px rgba(220,100,110,.2); }
    to { box-shadow: 0 0 28px rgba(220,100,110,.65); }
}

.wax-seal:hover {
    transform: translateX(-50%) scale(1.08);
}

.wax-seal.break {
    animation: sealBreak .65s forwards;
    pointer-events: none;
}

@keyframes sealBreak {
    0% { transform: translateX(-50%) scale(1) rotate(0); }
    35% { transform: translateX(-50%) scale(1.25) rotate(-12deg); }
    100% { transform: translateX(-50%) scale(.1) rotate(40deg); opacity: 0; }
}

/* Letter slides out */

.envelope-area.opened .letter {
    transform: translateY(-175px);
    transition-delay: .5s;
}

/* Full parchment */

.parchment-wrap {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    margin: 0;
    padding: 0;
    opacity: 0;
    overflow: hidden;
    visibility: hidden;
    pointer-events: none;
    background: rgba(9, 11, 32, .78);
    backdrop-filter: blur(8px);
    transform: scale(.97);
    transition:
        opacity .35s ease,
        transform .45s cubic-bezier(.2,.7,.2,1),
        visibility 0s linear .45s;
}

.parchment-wrap.revealed {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: scale(1);
    transition:
        opacity .35s ease,
        transform .45s cubic-bezier(.2,.7,.2,1);
}

.parchment-wrap::before {
    content: "";
    position: absolute;
    inset: 13px;
    z-index: 5;
    border: 1px solid rgba(114,75,37,.45);
    pointer-events: none;
}

/* Parchment */

.parchment {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 0;
    padding: clamp(55px, 8vh, 85px) clamp(24px, 8vw, 100px) 45px;
    overflow-y: auto;
    color: #513923;

    background:
        radial-gradient(ellipse at 10% 10%,
            rgba(255,255,255,.3),
            transparent 40%),
        radial-gradient(ellipse at 90% 90%,
            rgba(130,85,40,.18),
            transparent 45%),
        linear-gradient(115deg,
            #d8bd8c,
            #f4e7c7 35%,
            #ead6aa 70%,
            #d6b98a);

    border: 7px solid #a58252;

    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        inset 0 0 35px rgba(110,70,30,.25);
}

.parchment::after {
    content: "✦";
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    color: #9b784c;
    font-size: 23px;
}

/* Letter content */

.letter-body {
    position: relative;
    z-index: 2;
    opacity: 0;
    transition: opacity 1s;
}

.parchment-wrap.revealed .letter-body {
    opacity: 1;
    transition-delay: .1s;
}

.letter-date {
    text-align: right;
    font-style: italic;
    font-size: 16px;
    color: #856746;
}

.letter-heading {
    text-align: center;
    font-family: 'Great Vibes', cursive;
    font-size: clamp(35px, 6vw, 49px);
    font-weight: 400;
    margin: 40px 0 30px;
}

.letter-message {
    font-size: clamp(17px, 2.5vw, 21px);
    line-height: 1.85;
    white-space: pre-wrap;
    font-style: italic;
    min-height: 220px;
}

.letter-signature {
    font-family: 'Great Vibes', cursive;
    font-size: 35px;
    text-align: right;
    margin-top: 30px;
    opacity: 0;
}

.letter-signature.visible {
    opacity: 1;
    transition: opacity 1s;
}

/* Replay */

.replay {
    margin: 25px auto 0;
    display: none;
    padding: 12px 30px;
    color: #e5d1aa;
    background: transparent;
    border: 1px solid #c6a875;
    letter-spacing: 3px;
    font-family: inherit;
    cursor: pointer;
    font-size: 15px;
    transition: .3s;
}

.replay.visible {
    display: block;
}

.replay:hover {
    background: #c6a875;
    color: #17132f;
}

/* Mobile */

@media(max-width: 600px) {
    .intro {
        margin-bottom: 55px;
    }

    .envelope-area {
        height: 240px;
    }

    .fold-left,
    .fold-right {
        border-top-width: 120px;
        border-bottom-width: 120px;
    }

    .fold-bottom {
        border-bottom-width: 135px;
    }

    .flap {
        height: 120px;
    }

    .wax-seal {
        top: 82px;
        width: 65px;
        height: 65px;
    }

    .envelope-area.opened .letter {
        transform: translateY(-135px);
    }

    .parchment {
        padding: 55px 24px 30px;
    }
}

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<div class="ambient"></div>

<div class="scene">

    <div class="intro" id="intro">
        <h1>A Letter From The Heart</h1>
        <p>A little something for you</p>
    </div>

    <!-- ENVELOPE -->

    <div class="envelope-area" id="envelopeArea">

        <div class="envelope">

            <div class="envelope-back"></div>

            <!-- Letter preview inside envelope -->

            <div class="letter">
                <h2>A special letter...</h2>
                <p>Written with love, just for you.</p>
            </div>

            <!-- Envelope folds -->

            <div class="envelope-front">
                <div class="fold-left"></div>
                <div class="fold-right"></div>
                <div class="fold-bottom"></div>
            </div>

            <!-- Opening flap -->

            <div class="flap"></div>

            <!-- Wax seal -->

            <div class="wax-seal" id="waxSeal"
                 onclick="breakSeal()">
                ✦
            </div>

        </div>

    </div>

    <!-- PARCHMENT -->

    <div class="parchment-wrap" id="parchmentWrap">

        <div class="parchment">

            <div class="letter-body">

                <div class="letter-date">
                    A little memory, written with love
                </div>

                <h2 class="letter-heading">
                    Dear jnanika ...
                </h2>

                <div class="letter-message" id="letterMessage"></div>

                <div class="letter-signature" id="signature">
                    With love, Always ❤️
                </div>

            </div>

        </div>

    </div>

    <button class="replay" id="replay"
            onclick="replayExperience()">
        ↻ &nbsp; EXPERIENCE AGAIN
    </button>

</div>

<script>

/* ==================================
   PERSONALIZE YOUR LETTER HERE
================================== */

const recipient = "Nireeksha";

const message = `
Some people enter our lives unexpectedly,
and somehow make everything a little more beautiful.

You are one of those people.

There are moments that become memories,
conversations that become stories,
and people who become a special part of our lives.

I don't know whether words can ever express
everything that is in my heart,
but I hope this little letter brings a smile
to your face.

I hope you always find reasons to smile,
dream without limits,
and believe in the magic of little things.

No matter where life takes us,
some memories will always remain precious.

And you will always be a beautiful part
of this little story.

Keep shining, keep smiling,
and never stop being yourself.

i am sorry for creating all shits in your life but
i promise to be a better person for you and for us.
 I love you so much and i will always be there for you.

 i promise i will never irritate uhh please be my friend again daa
 i will never ever see u as a girlfriend without u my life feels empty daa
 i miss u a lott


 Happy birthday daa ❤️

`;

const signatureText = "With love, Always ❤️";

/* ==================================
   ANIMATION CONTROLS
================================== */

let typingInterval;
let opened = false;

function breakSeal() {

    if (opened) return;
    opened = true;

    const seal = document.getElementById("waxSeal");
    const envelope = document.getElementById("envelopeArea");
    const intro = document.getElementById("intro");

    seal.classList.add("break");

    intro.classList.add("hidden");

    setTimeout(() => {
        envelope.classList.add("opened");
    }, 250);

    setTimeout(revealParchment, 650);
}

/* ==================================
   UNROLL PARCHMENT
================================== */

function revealParchment() {

    const wrap = document.getElementById("parchmentWrap");

    wrap.classList.add("revealed");

    setTimeout(() => {
        startWriting();
    }, 500);
}

/* ==================================
   HANDWRITTEN TEXT EFFECT
================================== */

function startWriting() {

    const messageElement =
        document.getElementById("letterMessage");

    const signature =
        document.getElementById("signature");

    const heading =
        document.querySelector(".letter-heading");

    heading.textContent = "Dear " + recipient + "...";

    messageElement.textContent = "";
    signature.classList.remove("visible");

    let index = 0;

    clearInterval(typingInterval);

    typingInterval = setInterval(() => {

        if (index < message.length) {

            messageElement.textContent += message[index];

            index++;

            // Auto-scroll as text is written
            const parchment = document.querySelector(".parchment");
            parchment.scrollTop = parchment.scrollHeight;

        } else {

            clearInterval(typingInterval);

            setTimeout(() => {

                signature.classList.add("visible");

                document.getElementById("replay")
                    .classList.add("visible");

            }, 700);

        }

    }, 38);
}

/* ==================================
   REPLAY EXPERIENCE
================================== */

function replayExperience() {

    clearInterval(typingInterval);

    opened = false;

    document.getElementById("waxSeal")
        .classList.remove("break");

    document.getElementById("envelopeArea")
        .classList.remove("opened");

    document.getElementById("intro")
        .classList.remove("hidden");

    document.getElementById("parchmentWrap")
        .classList.remove("revealed");

    document.getElementById("letterMessage")
        .textContent = "";

    document.getElementById("signature")
        .classList.remove("visible");

    document.getElementById("replay")
        .classList.remove("visible");

    window.scrollTo({ top: 0, behavior: "smooth" });

}


</script>

</body>
</html>
